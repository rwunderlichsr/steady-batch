clear_meal:
  name: Clear meal
  description: Remove the meal on that day.
  fields:
    date:
      name: Date
      required: true
      selector:
        date:
    meal:
      name: Meal
      required: true
      selector:
        select:
          options:
            - Breakfast
            - Lunch
            - Dinner
            - Snack
set_goal:
  name: Set calorie goal
  description: Daily calorie number from Hume or MyFitnessPal.
  fields:
    calories:
      name: Calories
      required: true
      selector:
        number:
          min: 800
          max: 4000
          mode: box
import_plan:
  name: Import plan
  description: Load the meals sent from the Steady Batch app.
  fields:
    meals:
      name: Meals
      required: true
      selector:
